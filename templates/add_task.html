<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Task - StudyGenie</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="auth-container">

    <h1>StudyGenie</h1>
    <h2>Add Task</h2>

    <form method="POST">

        <input
            type="text"
            name="title"
            placeholder="Task Title"
            required
        >

        <textarea
            name="description"
            placeholder="Description"
            rows="4"
        ></textarea>

        <input
            type="text"
            name="subject"
            placeholder="Subject"
        >

        <label>Due Date</label>

        <input
            type="date"
            name="due_date"
            required
        >

        <label>Priority</label>

        <select name="priority">

            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>

        </select>

        <button type="submit">
            Add Task
        </button>

    </form>

    <p>
        <a href="{{ url_for('main.tasks') }}">
            Back to Tasks
        </a>
    </p>

</div>

</body>
</html>
