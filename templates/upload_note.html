<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Upload Notes - StudyGenie</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

<div class="dashboard-container">

    <header>

        <h1>StudyGenie</h1>

        <div>

            <a href="{{ url_for('main.dashboard') }}">
                Dashboard
            </a>

            &nbsp; | &nbsp;

            <a href="{{ url_for('main.notes') }}">
                Notes
            </a>

        </div>

    </header>


    <main>

        <h2>📄 Upload Study Notes</h2>

        <p>
            Upload a PDF containing your study material.
        </p>


        {% if error %}

        <div class="feature-card">

            <h3>Something went wrong</h3>

            <p>{{ error }}</p>

        </div>

        {% endif %}


        <div class="feature-card">

            <form
                method="POST"
                enctype="multipart/form-data"
            >

                <label for="title">
                    <strong>Note Title</strong>
                </label>

                <br><br>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Example: DBMS Unit 1"
                    required
                >

                <br><br>


                <label for="pdf_file">
                    <strong>Select PDF</strong>
                </label>

                <br><br>

                <input
                    type="file"
                    id="pdf_file"
                    name="pdf_file"
                    accept=".pdf"
                    required
                >

                <br><br>

                <button type="submit">
                    Upload PDF
                </button>

            </form>

        </div>

    </main>

</div>

</body>

</html>
