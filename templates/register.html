<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | StudyGenie</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

    <!-- ========================= -->
    <!-- AUTH NAVBAR -->
    <!-- ========================= -->

    <header class="navbar">

        <div class="navbar-container">

            <a href="{{ url_for('main.home') }}" class="brand">
                <span class="brand-icon">S</span>
                <span>StudyGenie</span>
            </a>

            <a href="{{ url_for('main.login') }}" class="auth-nav-link">
                Already have an account?
                <span>Login</span>
            </a>

        </div>

    </header>


    <!-- ========================= -->
    <!-- REGISTER -->
    <!-- ========================= -->

    <main class="auth-main">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    S
                </div>

                <span class="section-label">
                    GET STARTED
                </span>

                <h1>
                    Create your account
                </h1>

                <p>
                    Set up your StudyGenie profile and start organizing
                    your academic journey.
                </p>

            </div>


            <form method="POST" class="auth-form">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-section-title">
                    Academic Information
                </div>


                <div class="form-group">

                    <label for="college">
                        College
                    </label>

                    <input
                        type="text"
                        id="college"
                        name="college"
                        placeholder="Enter your college"
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="course">
                            Course
                        </label>

                        <input
                            type="text"
                            id="course"
                            name="course"
                            placeholder="e.g. B.Tech"
                        >

                    </div>


                    <div class="form-group">

                        <label for="branch">
                            Branch
                        </label>

                        <input
                            type="text"
                            id="branch"
                            name="branch"
                            placeholder="e.g. IT"
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="semester">
                        Semester
                    </label>

                    <input
                        type="number"
                        id="semester"
                        name="semester"
                        placeholder="Enter your semester"
                        min="1"
                        max="12"
                    >

                </div>


                <button type="submit" class="btn btn-primary auth-submit">
                    Create Account
                    <span>→</span>
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    Already have an account?
                    <a href="{{ url_for('main.login') }}">
                        Login here
                    </a>
                </p>

            </div>

        </div>

    </main>


    <footer class="auth-page-footer">

        <p>
            © 2026 StudyGenie. Built for students.
        </p>

    </footer>

</body>

</html>
