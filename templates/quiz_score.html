<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quiz Result - StudyGenie</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="app-shell">

    <!-- Navbar -->
    <nav class="app-navbar">

        <a href="{{ url_for('main.dashboard') }}" class="app-brand">

            <div class="brand-mark">S</div>

            <div>
                <div class="brand-name">StudyGenie</div>
                <div class="brand-subtitle">Student Assistant</div>
            </div>

        </a>


        <div class="nav-links">

            <a href="{{ url_for('main.dashboard') }}">
                Dashboard
            </a>

            <a href="{{ url_for('main.tasks') }}">
                Tasks
            </a>

            <a href="{{ url_for('main.quiz') }}" class="active">
                Quiz
            </a>

            <a href="{{ url_for('main.notes') }}">
                Notes
            </a>

            <a href="{{ url_for('main.assistant') }}">
                AI Assistant
            </a>

            <a href="{{ url_for('main.logout') }}" class="nav-logout">
                Logout
            </a>

        </div>

    </nav>


    <!-- Result -->
    <main class="page-container">

        <div class="quiz-score-page">

            <div class="score-card">

                <div class="score-success-icon">
                    ✓
                </div>

                <span class="page-eyebrow">
                    QUIZ COMPLETED
                </span>

                <h1>{{ topic }}</h1>

                <p class="score-label">
                    Your Score
                </p>

                <div class="score-value">
                    {{ score }} <span>/ {{ total }}</span>
                </div>

                <p class="score-message">
                    You answered
                    <strong>{{ score }}</strong>
                    out of
                    <strong>{{ total }}</strong>
                    questions correctly.
                </p>


                <div class="score-actions">

                    <a href="{{ url_for('main.quiz') }}"
                       class="primary-button">
                        Take Another Quiz
                    </a>

                    <a href="{{ url_for('main.dashboard') }}"
                       class="secondary-button">
                        Back to Dashboard
                    </a>

                </div>

            </div>

        </div>

    </main>


    <footer class="app-footer">
        <p>StudyGenie · Your AI-powered student assistant</p>
    </footer>

</div>

</body>

</html>
